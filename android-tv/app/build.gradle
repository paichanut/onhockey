plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.onhockey.app'
    compileSdk 35

    defaultConfig {
        applicationId 'tv.onhockey.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    // Sideload-only app: the key is committed so every build installs over the last one.
    signingConfigs {
        sideload {
            storeFile file('../sideload.keystore')
            storePassword 'onhockey'
            keyAlias 'onhockey'
            keyPassword 'onhockey'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
